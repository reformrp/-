<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REFORM RP — Loading</title>
    <style>
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        @font-face {
            font-family: 'VCR OSD Mono Rus';
            src: url('vcrosdmonorus_vhsicons.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'VCR OSD Mono Rus', monospace; 
        }
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }
        .main-logo {
            width: 450px; 
            max-width: 85vw; 
            height: auto;
            object-fit: contain;
            margin-bottom: 45px;
            animation: logo-glow 3s ease-in-out infinite alternate;
        }
        .loading-text {
            color: #ffffff; 
            font-size: 16px; 
            letter-spacing: 1px;
            white-space: nowrap;
            opacity: 0.95;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4), 0 0 15px rgba(255, 255, 255, 0.1); 
        }
        @keyframes logo-glow {
            0% {
                filter: drop-shadow(0 0 15px rgba(255, 235, 59, 0.2));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 35px rgba(255, 235, 59, 0.45));
                transform: scale(1.02);
            }
        }
        @media (max-width: 768px) {
            .loading-text { font-size: 12px; }
            .main-logo { margin-bottom: 35px; }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <img class="main-logo" src="https://i.postimg.cc/Z55V1PsV/rplogo.png" alt="Logo">
        <div class="loading-text" id="statusText">
            Загрузка<span id="dots"></span>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(event) {
            if (
                event.keyCode === 123 || 
                (event.ctrlKey && event.shiftKey && event.keyCode === 73) || 
                (event.ctrlKey && event.shiftKey && event.keyCode === 74) || 
                (event.ctrlKey && event.keyCode === 85) || 
                (event.ctrlKey && event.keyCode === 83)    
            ) {
                event.preventDefault();
                return false;
            }
        });
        setInterval(function() {
            function ban() {
                debugger;
            }
            ban();
        }, 100);

        const dotsElement = document.getElementById('dots');
        let dotCount = 0;
        const dotsInterval = setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            dotsElement.innerText = '.'.repeat(dotCount);
        }, 500); 

        setTimeout(() => {
            clearInterval(dotsInterval);
            dotsElement.innerText = '';
            const statusText = document.getElementById('statusText');
            statusText.innerText = "ГОТОВО!";
            statusText.style.color = "#4caf50"; 
            statusText.style.textShadow = "0 0 10px rgba(76, 175, 80, 0.6)";
            setTimeout(() => {
                window.location.href = 'reg.html'; 
            }, 1000);
        }, 4000);
    </script>

</body>
</html>
